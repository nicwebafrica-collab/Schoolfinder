# Publishes the app to GitHub Pages (free HTTPS hosting) every time main changes.
# Security: the security check runs first, and if it fails nothing is published.
# Actions are pinned to exact commits so nobody can swap in different code under the same version tag.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Security check
        run: node tools/security-check.js

  deploy:
    needs: security-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Collect the files the website needs (never tools, notes or old data)
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js js fonts icons _site/
          mkdir _site/data
          cd data && find . -name '*.json' ! -name '*.old.json' -exec cp --parents {} ../_site/data/ \;
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
